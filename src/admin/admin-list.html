<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>Admin Produk Lokal | Ras Survey</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #172033;
        background: #f3f6fb;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
      }

      * { box-sizing: border-box; }
      body { min-width: 320px; margin: 0; }
      button, input { font: inherit; }
      button, a { cursor: pointer; }
      .topbar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 1rem clamp(1rem, 3vw, 2.5rem); background: #fff; border-bottom: 1px solid #e2e8f0; }
      .brand { color: #101828; font-size: 1.1rem; font-weight: 850; letter-spacing: -.03em; text-decoration: none; }
      .local-badge { border-radius: 999px; padding: .4rem .7rem; color: #05603a; background: #ecfdf3; font-size: .78rem; font-weight: 750; }
      main { max-width: 1500px; margin: 0 auto; padding: 1.5rem clamp(1rem, 3vw, 2.5rem) 4rem; }
      h1 { margin: 0; font-size: clamp(1.6rem, 3vw, 2.1rem); letter-spacing: -.04em; }
      .subheading { margin: .4rem 0 0; color: #64748b; font-size: .92rem; }
      .panel { overflow: hidden; border: 1px solid #e2e8f0; border-radius: 1rem; background: #fff; box-shadow: 0 8px 25px rgb(16 24 40 / 4%); }
      .list-header { padding: 1.25rem 1rem .9rem; }
      .list-tools { display: grid; grid-template-columns: auto minmax(220px, 1fr); align-items: center; gap: 1rem; padding: 0 1rem 1rem; border-bottom: 1px solid #edf1f6; }
      .product-count { color: #344054; font-size: .9rem; }
      input { width: 100%; min-width: 0; border: 1px solid #cbd5e1; border-radius: .65rem; outline: 0; background: #fff; padding: .7rem .8rem; color: #172033; }
      input:focus { border-color: #84adff; box-shadow: 0 0 0 3px rgb(23 92 211 / 10%); }
      .product-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; min-height: 180px; padding: 1rem; }
      .product-row { display: flex; min-width: 0; flex-direction: column; overflow: hidden; border: 1px solid #e2e8f0; border-radius: 1rem; background: rgb(255 255 255 / 95%); transition: border-color .2s, box-shadow .2s, transform .2s; }
      .product-row:hover { transform: translateY(-2px); border-color: #bfdbfe; box-shadow: 0 12px 24px rgb(37 99 235 / 8%); }
      .new-product-card { display: flex; min-height: 100%; flex-direction: column; align-items: center; justify-content: center; gap: .75rem; border: 1px dashed #93c5fd; background: #f8fbff; padding: 1.25rem; color: #175cd3; text-align: center; text-decoration: none; }
      .new-product-card:hover { border-color: #175cd3; background: #eff6ff; }
      .new-product-icon { display: grid; width: 3rem; height: 3rem; place-items: center; border-radius: 999px; background: #dbeafe; font-size: 1.8rem; font-weight: 400; line-height: 1; }
      .new-product-card strong { font-size: .9rem; }
      .new-product-card span:last-child { color: #64748b; font-size: .76rem; }
      .product-image-frame { aspect-ratio: 1; overflow: hidden; background: #fff; }
      .product-image { display: block; width: 100%; height: 100%; object-fit: cover; transition: transform .5s; }
      .product-row:hover .product-image { transform: scale(1.04); }
      .product-info { display: flex; min-width: 0; flex: 1; flex-direction: column; padding: .85rem; }
      .product-category { color: #2563eb; font-size: .7rem; font-weight: 700; }
      .product-info strong { display: -webkit-box; overflow: hidden; margin-top: .25rem; color: #172033; font-size: .9rem; line-height: 1.4; overflow-wrap: anywhere; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
      .product-info p { display: -webkit-box; overflow: hidden; margin: .4rem 0 0; color: #64748b; font-size: .78rem; line-height: 1.5; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
      .product-actions { display: flex; gap: .5rem; margin-top: auto; padding: 0 .85rem .85rem; }
      .button { display: inline-flex; min-height: 2.35rem; align-items: center; justify-content: center; border: 1px solid #d0d5dd; border-radius: .6rem; background: #fff; padding: .45rem .8rem; color: #344054; font-size: .8rem; font-weight: 700; text-decoration: none; }
      .button:hover { background: #f8fafc; }
      .button.primary { border-color: #175cd3; background: #175cd3; color: #fff; }
      .button.primary:hover { background: #1849a9; }
      .button.danger { border-color: #fecdca; color: #b42318; }
      .button.danger:hover { background: #fef3f2; }
      .button:disabled { opacity: .6; cursor: wait; }
      .notice { display: none; margin-bottom: 1rem; border: 1px solid #abefc6; border-radius: .75rem; background: #ecfdf3; padding: .8rem 1rem; color: #05603a; font-size: .88rem; }
      .notice.error { border-color: #fecdca; background: #fef3f2; color: #b42318; }
      .empty { grid-column: 1 / -1; padding: 2rem 1rem; color: #64748b; text-align: center; font-size: .86rem; }
      @media (min-width: 640px) {
        .product-list { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      }
      @media (min-width: 900px) {
        .product-list { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      }
      @media (min-width: 1200px) {
        .product-list { grid-template-columns: repeat(5, minmax(0, 1fr)); }
      }
      @media (max-width: 560px) {
        .list-header { padding: 1rem .75rem .75rem; }
        .list-tools { grid-template-columns: 1fr; gap: .65rem; padding: 0 .75rem .75rem; }
        .product-list { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .65rem; padding: .65rem; }
        .product-info { padding: .65rem; }
        .product-actions { padding: 0 .65rem .65rem; }
        .product-actions .button { flex: 1; }
        .product-actions .button { padding: .4rem .3rem; font-size: .74rem; }
      }
      @media (max-width: 360px) {
        .product-list { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/">RAS SURVEY <span style="font-weight:500;color:#64748b">/ Admin</span></a>
      <span class="local-badge">LOKAL · TIDAK UNTUK PUBLIK</span>
    </header>
    <main>
      <div class="notice" id="notice" role="status" aria-live="polite"></div>
      <section class="panel" aria-label="Daftar produk">
        <div class="list-header">
          <h1>Kelola Produk</h1>
          <p class="subheading">Pilih produk untuk mengedit atau menghapus dari katalog.</p>
        </div>
        <div class="list-tools">
          <input id="product-search" type="search" placeholder="Cari nama atau kategori…" aria-label="Cari produk" />
          <strong class="product-count" id="product-count">Memuat produk…</strong>
        </div>
        <div class="product-list" id="product-list"></div>
      </section>
    </main>
    <script type="module" src="/__local-admin/admin-list.js"></script>
  </body>
</html>
